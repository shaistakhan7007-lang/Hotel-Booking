<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Colorful Hotel Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        /* ROOM CARDS */
        .rooms {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .room-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transition: transform 0.3s;
        }

        .room-card:hover {
            transform: scale(1.05);
        }

        .room-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .room-info {
            padding: 15px;
        }

        .room-info h3 {
            margin: 5px 0;
            color: #e74c3c;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: #27ae60;
        }

        .availability {
            margin-top: 5px;
            color: #2980b9;
        }

        /* BOOKING FORM */
        .booking-form {
            background: white;
            padding: 25px;
            margin-top: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            color: #34495e;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        textarea {
            resize: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        footer {
            margin-top: 40px;
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>🌟 Rainbow Stay Hotel 🌟</h1>
    <p>Luxury • Comfort • Colorful Experience</p>
</header>

<div class="container">

    <h2>🏨 Available Rooms</h2>

    <div class="rooms">

        <!-- Single Bed Room -->
        <div class="room-card">
            <img src="https://images.unsplash.com/photo-1560448204-e02f11c3d0e2" alt="Single Bed Room">
            <div class="room-info">
                <h3>Single Bed Room</h3>
                <p class="price">₹2,000 / night</p>
                <p class="availability">Available: 8 Rooms</p>
            </div>
        </div>

        <!-- Deluxe Room -->
        <div class="room-card">
            <img src="https://images.unsplash.com/photo-1505691938895-1758d7feb511" alt="Deluxe Room">
            <div class="room-info">
                <h3>Deluxe Room</h3>
                <p class="price">₹4,500 / night</p>
                <p class="availability">Available: 5 Rooms</p>
            </div>
        </div>

        <!-- Luxury Suite -->
        <div class="room-card">
            <img src="https://images.unsplash.com/photo-1618773928121-c32242e63f39" alt="Luxury Suite">
            <div class="room-info">
                <h3>Luxury Suite</h3>
                <p class="price">₹8,000 / night</p>
                <p class="availability">Available: 2 Rooms</p>
            </div>
        </div>

    </div>

    <!-- BOOKING FORM -->
    <div class="booking-form">
        <h2>📝 Book Your Room</h2>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" placeholder="Enter your phone number" required>
        </div>

        <div class="form-group">
            <label>Room Type</label>
            <select>
                <option>Single Bed Room</option>
                <option>Deluxe Room</option>
                <option>Luxury Suite</option>
            </select>
        </div>

        <div class="form-group">
            <label>Check-in Date</label>
            <input type="date">
        </div>

        <div class="form-group">
            <label>Check-out Date</label>
            <input type="date">
        </div>

        <div class="form-group">
            <label>Number of Guests</label>
            <input type="number" min="1" max="5">
        </div>

        <div class="form-group">
            <label>Special Requests</label>
            <textarea rows="3" placeholder="Any special requirements..."></textarea>
        </div>

        <button onclick="alert('🎉 Booking Submitted Successfully!')">
            Confirm Booking
        </button>
    </div>

</div>

<footer>
    <p>© 2025 Rainbow Stay Hotel | Designed with ❤️</p>
</footer>

</body>
</html>
